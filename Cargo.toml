[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tokativ"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokativ-audio = { path = "crates/audio" }
tokativ-config = { path = "crates/config" }
tokativ-engine = { path = "crates/engine" }
tokativ-input = { path = "crates/input" }
tokativ-ui = { path = "crates/ui" }
tokativ-updater = { path = "crates/updater" }

anyhow = "1.0"
dirs = "6.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
# PulseAudio host for a list of the sound server's real sources. handy-cpal is cpal 0.18.2 with the
# one-line record stream fix from RustAudio/cpal#1387, which plain 0.18.2 lacks.
cpal = { package = "handy-cpal", version = "0.18.2", features = ["pulseaudio"] }
rtrb = "0.3"
rubato = "0.16"
rustfft = "6.4"
rustix = { version = "1", features = ["event", "fs"] }
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
futures = "0.3"
hound = "3.5"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "b5b49cc0dfdfd5c0f7c921c3d8bbd42cf3cae8d1" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "b5b49cc0dfdfd5c0f7c921c3d8bbd42cf3cae8d1", features = [
  "font-kit",
  "wayland",
] }
icons = { git = "https://github.com/sonorahq/sonora", rev = "71b58c80" }
ui = { git = "https://github.com/sonorahq/sonora", rev = "71b58c80" }
regex = "1.12"
whatlang = "0.18"
unicode-segmentation = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
sha2 = "0.10"
semver = "1"
tempfile = "3"
flate2 = "1"
tar = "0.4"
libc = "0.2"
# GGUF speech models through ggml. Each crate that uses it picks the graphics backend for its
# platform: Metal on macOS, Vulkan everywhere else.
transcribe-cpp = { version = "0.4", default-features = false }
clap = { version = "4.5", features = ["derive"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
notify = "8.2"
# KDE's D-Bus services on Plasma.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Typing, the clipboard, global hotkeys and the tray on macOS and Windows, where the Wayland
# protocols and the StatusNotifierItem tray do not exist.
arboard = "3.7"
enigo = "0.6"
global-hotkey = "0.9"
tray-icon = "0.26"
# The control socket on Windows, which has no Unix sockets in std.
interprocess = "2.4"
# Launch at login on Windows.
winreg = "0.56"
windows-sys = "0.61"
# The pill's window handle on Windows, to keep clicks on it from taking focus.
raw-window-handle = "0.6"
# Typing on macOS, with a key-up after every key-down so every app takes the text.
core-graphics = "0.25"
# Keeps the daemon out of the Dock on macOS.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
] }
# The daemon's memory and processor time where there is no /proc.
memory-stats = "1.2"
cpu-time = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# GPUI and the UI crate are too slow unoptimized to judge scrolling or animation by, so dev builds
# optimize every dependency and keep only this workspace's crates debuggable.
[profile.dev.package."*"]
debug = false
opt-level = 2
