[package]
name = "tokativ-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
icons.workspace = true
log.workspace = true
pulldown-cmark.workspace = true
tokativ-audio.workspace = true
tokativ-config.workspace = true
ui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
tokativ-engine.workspace = true
tokativ-updater.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["param"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpu-time.workspace = true
memory-stats.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSView", "NSWindow"] }
raw-window-handle.workspace = true
